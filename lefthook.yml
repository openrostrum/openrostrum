# Git hooks. Installed via `pnpm prepare` (lefthook install).
pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs,cts,json,jsonc,md}"
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true
    - name: lint
      run: pnpm lint

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: verify
      run: pnpm verify
