area: call-for-papers
title: Call for Papers
prefix: CFP
area_weight: 20
overview: >
  SessionBoard's Call for Papers module runs the submission side of the proposal
  lifecycle end-to-end. Organizers build a custom submission form (multiple field
  types, required flags, conditional logic keyed to track or session format), set
  open/close dates, and publish it on a branded public portal. Speakers create
  submitter accounts, optionally save drafts, submit proposals, receive on-screen
  and email confirmation, and can view and edit their submissions from a personal
  dashboard until the close date. Organizers assign committee reviewers, who score
  assigned submissions (rating plus comment) from an isolated reviewer dashboard;
  organizers then record accept/reject decisions, dispatch decision notification
  emails, and hand accepted talks off to the sessions/agenda area without re-entry.
  Review DEPTH (multi-round review, blind/anonymized review, weighted scorecards,
  aggregate score tables, bulk reviewer operations, exact reviewer-queue scoping,
  co-authors) is owned by the abstract-management spec and is deliberately not
  scored here. Note: a scenario's persona is its STARTING identity — scenarios may
  sign out and switch identities mid-run; the harness supplies all fixture
  credentials to every scenario.
personas: [organizer, speaker, reviewer]
scenarios:
  - id: CFP-S1
    name: Organizer builds and publishes the CFP
    persona: organizer
    steps: |
      1. Navigate to the app root. Find the organizer/admin entry point — try obvious
         routes (/admin, /dashboard, /organizer) and nav links ("Admin", "Dashboard",
         "Organizer", "Sign up", "Get started"). If open signup exists, sign up as the
         organizer identity Jordan Alvarez from the sample data; otherwise sign in with
         the organizer fixture credentials.
      2. Create the event "DevFlow Conf 2027" (2027-05-12 to 2027-05-14, Moscone West,
         San Francisco) if no event exists yet. If the clone is single-event or comes
         pre-seeded, use the existing event.
      3. Find the call-for-papers setup area — it may be called "Call for Papers",
         "CFP", "Submissions", "Submission form", "Forms", or "Apply". Screenshot it.
      4. Configure the three fixture tracks (AI Engineering, Platform & Infra,
         Developer Experience) and the five session formats exactly as labeled in the
         fixtures — "Keynote (45 min)", "Talk (30 min)", "Lightning Talk (10 min)",
         "Workshop (120 min)", "Panel (45 min)" — wherever tracks/formats are managed.
      5. In the form builder, ensure the form has at minimum: session title (required
         text), abstract (required long text), track (dropdown), format (dropdown),
         speaker bio (long text). Then ADD two custom fields: a required short-text
         field named "Key takeaway", and a dropdown named "Audience level" with options
         Beginner / Intermediate / Advanced. Screenshot the builder showing the added
         fields and their required/optional flags.
      6. Add a conditional field: a long-text field "Workshop prerequisites" configured
         to show only when the format answer is "Workshop (120 min)". If the builder
         has no conditional/show-when capability, record that observation explicitly
         and continue.
      7. Set the submission window: open now, close date 2027-04-30 (any clearly future
         date is acceptable). Screenshot the open/close date settings.
      8. Publish the CFP and capture the public portal URL (copy-link button, "View
         public form", or the visible address). Record the exact URL as an observation
         — later scenarios reuse it.
      9. Sign out. Load the public portal WITHOUT being logged in. Screenshot the
         page showing event branding/name, the submission deadline, and the form
         (or its start button).
      10. On the public form, open the track dropdown, the format dropdown, and the
         "Audience level" dropdown; screenshot each open so the options are visible
         (the three fixture tracks, the five fixture formats, and
         Beginner/Intermediate/Advanced). Then test the conditional field: select
         format "Workshop (120 min)" and screenshot showing "Workshop prerequisites"
         visible; switch to "Talk (30 min)" and screenshot showing it hidden. Record
         whether visibility changed without a full page reload. If the form cannot be
         interacted with while logged out (account required first), record that —
         these checks are repeated in CFP-S2 as the speaker.
      11. Attempt to submit (or advance past the page containing required fields) with
         "Key takeaway" and other required fields left empty. Screenshot the
         validation error. If the form requires creating an account before it can be
         filled, record that and leave validation testing to the speaker scenario.
      12. MULTI-EVENT PROBE. Sign back in as the organizer and look for a way to run a
         SECOND event alongside the first: an events list, an event switcher, a
         "New event"/"Create event" control. If one exists, create a second event
         named "Forward Summit 2028" and screenshot it listed alongside the first.
         Then open the second event's submissions/abstracts area and screenshot it,
         confirming whether it is empty (data scoped per event) or shows the first
         event's submissions (data leaking across events). If NO way to create or
         switch events exists, record an explicit observation naming every place you
         looked and stating that the app appears to be single-event — do not skip
         this step silently.
    success_signals:
      - Builder screenshot shows "Key takeaway" (required) and "Audience level" dropdown
      - Public portal loads logged-out with event name and a visible deadline
      - Two screenshots proving the conditional field toggles with format selection
      - Validation error screenshot on empty required field
      - Recorded observation of the public portal URL
  - id: CFP-S2
    name: Speaker drafts, submits, and edits proposals
    persona: speaker
    steps: |
      1. Open the public CFP portal (the URL recorded in CFP-S1; otherwise find it from
         the app's public homepage — look for "Submit a talk", "Call for Papers",
         "CFP", "Apply", or "Submissions").
      2. Create a submitter account as the speaker identity Priya Raman from the sample
         data (signup may happen before the form or as part of submitting). Screenshot
         the signup/login step.
      3. Draft test: start a new submission and enter ONLY the title "Taming 40-Minute
         CI: Incremental Builds at Monorepo Scale". Look for a "Save as draft" /
         "Save draft" / "Save and finish later" control and use it. Screenshot any
         draft banner/indicator. Navigate away (or sign out and back in), return to the
         form, and verify the draft is offered for resume or the title is pre-filled;
         screenshot that. If no draft capability exists, record its absence and
         continue with a fresh submission.
      4. Before completing the form, attempt to submit/advance with the abstract and
         "Key takeaway" empty; screenshot the required-field validation error.
      5. If CFP-S1 could not exercise the public form logged-out (account required
         first), run the deferred checks here before filling in: screenshot the open
         track, format, and "Audience level" dropdowns showing their options, then
         select format "Workshop (120 min)" and screenshot "Workshop prerequisites"
         visible, switch to "Talk (30 min)" and screenshot it hidden.
      6. Complete the full "Taming 40-Minute CI" proposal from the sample data:
         abstract, track "Platform & Infra", format "Talk (30 min)", audience level
         "Intermediate", speaker bio from Priya's fixture bio, and for "Key takeaway"
         enter "A decision framework for which incremental-build investments pay off".
         Screenshot the filled form, then submit.
      7. Screenshot the confirmation state (confirmation page, banner, or thank-you
         message). Record its exact wording, including any mention that a confirmation
         email was sent.
      8. Find the submitter dashboard — "My submissions", "My sessions", "My proposals"
         — and verify the proposal is listed with a status label (e.g. Submitted /
         Under Review / Pending). Screenshot the dashboard row and record the status
         text.
      9. Edit test: open the submission from the dashboard (look for an Edit or "View
         Submission" affordance), append the sentence "Updated: now includes 2026
         benchmark data." to the end of the abstract, and save. Reload the page and
         reopen the submission; screenshot proving the appended sentence persisted.
      10. Submit a second complete proposal from the sample data: "Your AI Pair
         Programmer Is Lying to You: Verification Patterns That Scale" (track
         "AI Engineering", format "Talk (30 min)", audience level "Advanced"). For
         "Key takeaway" enter "Verification patterns that scale beyond code review".
      11. Screenshot the submitter dashboard showing BOTH proposals listed with
         statuses.
    success_signals:
      - Draft indicator and resumed-draft screenshots (or recorded absence)
      - Filled form screenshot before submitting and the confirmation state after
      - Dashboard listing both submissions with status labels
      - Persisted edited abstract containing the "Updated:" sentence
  - id: CFP-S3
    name: Organizer assigns a reviewer; reviewer scores
    persona: organizer
    steps: |
      1. Sign in as the organizer Jordan Alvarez.
      2. Open the submissions list for the event. Verify both proposals from CFP-S2 are
         listed. Screenshot the list. Open the "Taming 40-Minute CI" submission detail
         and verify the field values round-tripped intact (title, track "Platform &
         Infra", format, audience level) AND that the abstract ends with "Updated: now
         includes 2026 benchmark data." (the speaker's edit). Screenshot the detail.
      3. Find reviewer management — "Reviewers", "Committee", "Review", "Evaluations",
         "Assignments". Create or invite a reviewer for Sam Whitfield using the
         reviewer fixture identity. If the flow lets you set a password directly, use
         the fixture password; if it is invite-by-email only, look for a copyable
         invite/magic link or any way to provision credentials, and record exactly
         what the flow offers.
      4. Assign Sam Whitfield ONLY the "Taming 40-Minute CI" submission — explicitly
         not the "AI Pair Programmer" one. Screenshot the assignment screen showing
         which submissions are assigned to him.
      5. Sign out. Sign in as the reviewer Sam Whitfield (fixture credentials, or the
         invite link captured in step 3).
      6. Screenshot the reviewer dashboard. Verify it lists exactly one submission
         ("Taming 40-Minute CI") and exposes no admin navigation. Attempt to reach the
         unassigned "Your AI Pair Programmer Is Lying to You" submission — search the
         reviewer UI for it, and if submission URLs follow a guessable pattern, try
         swapping the identifier. Screenshot/record the outcome (not listed, access
         denied, 404, etc.).
      7. Open the assigned submission. Fill the scorecard: give a rating of 4 (if the
         scorecard has multiple criteria, rate each 4) and enter the fixture review
         comment ("Strong practical content and a clear narrative arc; abstract could
         name the specific tooling used. Recommend accept for the Platform track.").
         Screenshot the filled scorecard, then submit it.
      8. Verify the reviewer dashboard now shows the item as reviewed/completed (status
         chip, checkmark, or moved to a done list). Screenshot it.
    success_signals:
      - Organizer submissions list with both fixture proposals and intact field values
      - Assignment screen mapping Sam Whitfield to exactly one submission
      - Reviewer dashboard showing only the assigned submission; blocked/absent access
        to the unassigned one
      - Filled scorecard (rating 4 + comment) and post-submit completed state
  - id: CFP-S4
    name: Organizer decides, notifies, hands off, and closes the CFP
    persona: organizer
    steps: |
      1. Sign in as the organizer Jordan Alvarez and open the "Taming 40-Minute CI"
         submission. Verify Sam Whitfield's review is visible — the rating of 4 and his
         comment text from CFP-S3. Screenshot it.
      2. Record decisions: mark "Taming 40-Minute CI" as Accepted and "Your AI Pair
         Programmer Is Lying to You" as Rejected (per-row status control, detail-page
         action, or bulk action — use whatever the UI offers). Screenshot the
         submissions list showing the two different decision statuses side by side.
      3. Find the decision-notification step — "Send notifications", "Notify
         speakers", "Send decision emails", possibly template-based. If a template or
         compose step appears, use the fixture acceptance subject/body from the sample
         data communications for the acceptance; the fixtures have no rejection
         template, so any brief rejection subject/body is fine. Trigger the send for
         both the accepted and rejected submissions. Screenshot the compose/confirm step AND the sent/queued
         confirmation (sent count, per-submission "notified" indicator, or an email
         log). If no notification feature exists, record its absence.
      4. Navigate to the sessions/agenda area of the event ("Sessions", "Agenda",
         "Schedule", "Program"). Verify a session titled "Taming 40-Minute CI:
         Incremental Builds at Monorepo Scale" exists with speaker Priya Raman and
         track "Platform & Infra" carried over. If the UI requires an explicit
         "convert to session" / "move to agenda" action on the accepted submission,
         perform it first. Screenshot the session entry.
      5. Return to CFP settings and set the submission close date to a past date
         (e.g. yesterday). Save and screenshot the setting.
      6. Sign out. Load the public portal URL logged-out and verify it now shows a
         closed state — a "submissions closed" message or otherwise no way to start a
         new submission. Screenshot it.
      7. Sign in as the speaker Priya Raman. Screenshot her dashboard showing "Taming
         40-Minute CI" as Accepted and "Your AI Pair Programmer Is Lying to You" as
         Rejected (record the exact status labels used).
      8. Open one of her submissions and verify editing is no longer possible now that
         the CFP is closed — the form is read-only, the edit control is gone, or an
         "editing closed" message appears. If a field still accepts input, attempt to
         save a change and record/screenshot the rejection. Screenshot the locked
         state.
    success_signals:
      - Organizer view of the recorded review (rating 4 + comment)
      - Submissions list with one Accepted and one Rejected status
      - Notification send confirmation (or recorded absence)
      - Session in the agenda area matching the accepted talk's metadata
      - Public portal in closed state; speaker-side statuses updated and editing locked
rubric:
  - id: CFP-01
    criterion: "Organizer can build a custom submission form — adding fields of at least 3 types (short text, long text, dropdown) with required/optional flags — and the changes render on the public form with required-field validation enforced"
    weight: 3
    type: crud
    testability: auto
    scenarios: [CFP-S1, CFP-S2]
    pass_criteria: "The added fields ('Key takeaway' required text, 'Audience level' dropdown with 3 options) appear on the public form with correct types and options, and attempting to submit with a required field empty is blocked with a visible validation error"
    evidence: "Builder screenshot showing the added fields and required flags; public-form screenshot showing them rendered; screenshot of a validation error on an empty required field (from S1 logged-out or S2 as the speaker)"
  - id: CFP-02
    criterion: "Submission form supports conditional logic: a field configured to show only for a given session format (or track) appears and disappears based on the submitter's selection"
    weight: 1
    type: depth
    testability: auto
    scenarios: [CFP-S1, CFP-S2]
    pass_criteria: "A field configured to depend on the session format appears for the workshop-style format and disappears for the talk-style format — visibility follows the controlling answer in both directions. The app's own format vocabulary counts (e.g. 'Workshop' / 'Break Out'); the fixture's duration-labelled names are illustrative, not required"
    evidence: "Two public-form screenshots, one per format selection, showing the dependent field present then absent (from CFP-S1 logged-out, or CFP-S2 as the speaker if the form requires an account first); builder screenshot of the show-when configuration if the UI exposes one"
  - id: CFP-03
    criterion: "A public CFP portal is reachable without any login and shows event branding/name, the submission deadline, and the configured tracks and formats as selectable options"
    weight: 3
    type: exists
    testability: auto
    scenarios: [CFP-S1, CFP-S2]
    pass_criteria: "The portal URL loads in a logged-out context showing the event name, a visible deadline/close date, and a form (or entry point) whose track and format options match the fixture configuration"
    evidence: "Logged-out screenshot of the portal with event name and deadline; screenshot of the open track/format dropdowns showing the fixture options (from CFP-S1, or CFP-S2 if the form requires an account first); the recorded portal URL observation"
  - id: CFP-04
    criterion: "The portal enforces the configured submission window: once the close date is in the past, the public portal blocks new submissions with a closed state"
    weight: 2
    type: rule
    testability: auto
    scenarios: [CFP-S4]
    pass_criteria: "After the organizer sets the close date to a past date, the logged-out portal shows a closed/'submissions closed' state with no way to start or submit a new proposal"
    evidence: "Screenshot of the close-date setting saved with a past date; logged-out screenshot of the portal in its closed state (contrast with the open-portal screenshot from CFP-S1)"
  - id: CFP-05
    criterion: "A speaker can create a submitter account from the portal, complete and submit a proposal, see an on-screen confirmation, and find the submission listed with a status in their own dashboard"
    weight: 3
    type: crud
    testability: auto
    scenarios: [CFP-S2]
    pass_criteria: "Account creation succeeds, the 'Taming 40-Minute CI' fixture proposal submits, a confirmation state is shown, and the submitter dashboard lists the proposal with a status label (Submitted / Under Review / Pending or equivalent)"
    evidence: "Screenshots of the signup step, the filled form pre-submit, the confirmation state, and the dashboard row with its status text"
  - id: CFP-06
    criterion: "Submitted data round-trips to the organizer: the submission appears in the organizer's list with title, abstract, track, format, and custom-field values intact"
    weight: 3
    type: roundtrip
    testability: auto
    scenarios: [CFP-S2, CFP-S3]
    pass_criteria: "The organizer's submissions list shows both fixture proposals, and the detail view of 'Taming 40-Minute CI' shows the same title, track 'Platform & Infra', format, audience level, and abstract text the speaker entered, with no lost or mangled fields"
    evidence: "Screenshot of the organizer submissions list with both titles; screenshot of the submission detail whose field values match the fixture data entered in CFP-S2"
  - id: CFP-07
    criterion: "The public form supports saving an in-progress submission as a draft (with as little as a title) and resuming it on return"
    weight: 1
    type: depth
    testability: auto
    scenarios: [CFP-S2]
    pass_criteria: "With only the title entered, a save-as-draft action succeeds, some draft indicator is shown, and on returning to the form the draft is offered for resume or the saved data is pre-filled"
    evidence: "Screenshot of the draft banner/indicator after saving; screenshot after returning showing the resume prompt or the pre-filled title; agent observation if the feature is absent"
  - id: CFP-08
    criterion: Submitting a proposal triggers an automated confirmation email to the submitter referencing the submission
    weight: 1
    type: side-effect
    testability: manual
    pass_criteria: "A confirmation email arrives at the submitter's address within a few minutes of submitting, referencing the event and the submitted title; if the clone exposes an in-app email log/outbox, a logged message with correct recipient and title also passes"
    evidence: "Screenshot of the received email (or in-app email log entry) showing recipient, subject, and the submission title"
    manual_instructions: "Submit a proposal using an inbox you can inspect (e.g. re-run the CFP-S2 submission with a real mailbox address, or use the clone's email log/outbox page if it has one). Within a few minutes, verify an email arrived that names the event and the submitted talk title. Capture a screenshot of the message showing recipient, subject, and title. Also note whether the CFP-S2 confirmation screen claimed an email was sent."
  - id: CFP-09
    criterion: "A submitter can edit an existing submission while the CFP is open, and the edited content is what the organizer subsequently sees (inferred norm from Sessionize/EasyChair, confirmed by SessionBoard participant docs)"
    weight: 2
    type: roundtrip
    testability: auto
    scenarios: [CFP-S2, CFP-S3]
    pass_criteria: "The appended abstract sentence ('Updated: now includes 2026 benchmark data.') persists across reload in the speaker's view and appears verbatim in the organizer's view of the same submission"
    evidence: "Speaker-side screenshot of the edited abstract after reload (CFP-S2); organizer-side screenshot of the submission detail containing the same sentence (CFP-S3)"
  - id: CFP-10
    criterion: "Organizer can provision a reviewer (create/invite with usable credentials) and the reviewer role is separated from admin: signed in as the reviewer, a reviewer-facing dashboard is shown with no organizer/admin navigation or capability exposed. Exact assigned-queue scoping ('the queue contains exactly the assigned set, nothing else') is deliberately deferred to abstract-management's ABS-05 and not scored here."
    weight: 2
    type: scoping
    testability: auto
    scenarios: [CFP-S3]
    pass_criteria: "Sam Whitfield is created/invited with credentials the agent can use, signs in successfully, and lands on a reviewer-facing dashboard that exposes no admin navigation or organizer capability. Whether his queue contains exactly the assigned submissions is graded once, by ABS-05 — do not double-count it here."
    evidence: "Screenshot of the reviewer provisioning/invite flow; screenshot of the reviewer dashboard signed in as Sam showing a reviewer-scoped view with no admin navigation"
  - id: CFP-11
    criterion: "A reviewer can record a review on an assigned submission (a rating plus a text comment) and the recorded review is visible to the organizer, with completion state updating on the reviewer dashboard. Scorecard field-type depth (numeric/dropdown/free-text criteria editors) is graded by abstract-management's ABS-03, not here."
    weight: 2
    type: roundtrip
    testability: auto
    scenarios: [CFP-S3, CFP-S4]
    pass_criteria: "The rating of 4 and the fixture comment are accepted and persist; the reviewer dashboard marks the item reviewed/completed; the organizer's view of the submission shows the same rating and comment. No scorecard field-type variety is required here (see ABS-03)."
    evidence: "Screenshot of the filled scorecard before submit; screenshot of the completed state on the reviewer dashboard; organizer-side screenshot (CFP-S4) showing rating 4 and the comment text"
  - id: CFP-12
    criterion: "Organizer can record accept and reject decisions on submissions, and the admin list reflects the distinct decision statuses"
    weight: 3
    type: crud
    testability: auto
    scenarios: [CFP-S4]
    pass_criteria: "'Taming 40-Minute CI' is marked Accepted and 'Your AI Pair Programmer Is Lying to You' is marked Rejected; both statuses persist and are shown distinctly in the organizer's submissions list"
    evidence: "Screenshot of the decision control being used; screenshot of the submissions list showing one Accepted and one Rejected row"
  - id: CFP-13
    criterion: "Decision statuses propagate to the submitter: the speaker's own dashboard reflects Accepted/Rejected for the corresponding proposals"
    weight: 2
    type: roundtrip
    testability: auto
    scenarios: [CFP-S4]
    pass_criteria: "Signed in as Priya Raman after decisions were recorded, her dashboard shows the CI talk as Accepted and the AI talk as Rejected (or unambiguous equivalents of those statuses)"
    evidence: "Screenshot of the speaker dashboard with both status labels visible; recorded exact status wording"
  - id: CFP-14
    criterion: "The platform can send (or queue) acceptance and rejection notification emails to decided submitters, with the UI confirming dispatch"
    weight: 2
    type: side-effect
    testability: auto-partial
    scenarios: [CFP-S4]
    pass_criteria: "A notify/send-decisions action exists, accepts or provides accept/reject templates (merge-field support like {speaker_name}/{talk_title} is a plus, inferred), and after triggering it the UI reports the messages as sent/queued for the correct recipient sets; NOT auto-verified: actual delivery and body personalization"
    evidence: "Screenshot of the compose/template step (using the fixture acceptance subject/body if offered) and of the sent/queued confirmation, per-submission notified indicator, or email log entries"
    manual_instructions: "After decisions are recorded, trigger the decision notifications with submitter addresses that use a real, inspectable inbox. Verify one acceptance email and one rejection email arrive, each naming the correct talk title (and speaker name if templates support merge fields). Screenshot both messages."
  - id: CFP-15
    criterion: "An accepted submission becomes available as a session in the sessions/agenda area with its metadata (title, speaker, track) intact, without re-entering the data"
    weight: 2
    type: handoff
    testability: auto
    scenarios: [CFP-S4]
    pass_criteria: "After acceptance (plus an explicit convert/move action only if the UI requires one), the sessions/agenda area contains a session titled 'Taming 40-Minute CI: Incremental Builds at Monorepo Scale' with speaker Priya Raman and track 'Platform & Infra' carried over with no manual re-typing of those fields"
    evidence: "Screenshot of the accepted submission detail; screenshot of the matching session entry in the sessions/agenda area showing the same title, speaker, and track"
  - id: CFP-16
    criterion: "Submission editing locks after the CFP close date: the speaker can no longer modify a submission once the call is closed"
    weight: 2
    type: rule
    testability: auto
    scenarios: [CFP-S4]
    pass_criteria: "With the close date in the past, the speaker's submission opens read-only, hides its edit affordance, or shows an editing-closed message — and no edit can be saved"
    evidence: "Speaker-side screenshot of the locked/read-only submission (or editing-closed message), taken after the close date was moved to the past — contrast with the successful edit in CFP-S2"
  - id: CFP-17
    criterion: "The app supports more than one event: an organizer can create a second event and both events coexist, each reachable via an events list or event switcher"
    weight: 2
    type: exists
    testability: auto
    scenarios: [CFP-S1]
    pass_criteria: "A second event ('Forward Summit 2028') is created and both events appear together in an events list or switcher. A single-event app with no event-creation or switching UI anywhere fails this item — an agent observation naming the places checked is sufficient evidence of absence"
    evidence: "Screenshot of the events list or switcher showing both events; or the agent's explicit observation that no event creation/switching UI exists, listing where it looked"
  - id: CFP-18
    criterion: "Event data is scoped per event: submissions, sessions and speakers belonging to one event do not appear inside another event"
    weight: 2
    type: scoping
    testability: auto
    scenarios: [CFP-S1]
    pass_criteria: "The second event's submissions/abstracts area is empty (or contains only its own records) rather than showing the first event's submissions. Cross-event leakage of records is a fail"
    evidence: "Screenshot of the second event's submissions/abstracts list contrasted with the first event's populated list"
    manual_instructions: "Only if the agent could not create a second event but the app does support multiple events: create two events by hand, add a submission to one, and confirm it is not visible from the other."
