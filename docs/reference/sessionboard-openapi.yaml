  /v1/event/{eventId}/sponsors/{sponsorId}:
    get:
      operationId: get-sponsor
      summary: Get a sponsor
      description: Retrieve a single sponsor by ID.
      tags:
        - Sponsors
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: The event ID.
        - name: sponsorId
          in: path
          required: true
          schema:
            type: string
          description: The sponsor ID.
        - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sponsor'
        '401':
          description: Unauthorized
        '404':
          description: Sponsor not found
    put:
      operationId: update-sponsor
      summary: Update a sponsor
      description: Update an existing sponsor. Requires the `write:sponsors` scope. Optionally send `updated_at` for optimistic concurrency control.
      tags:
        - Sponsor Writes
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: The event ID.
        - name: sponsorId
          in: path
          required: true
          schema:
            type: string
