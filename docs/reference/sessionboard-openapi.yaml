  # ──────────────────────────────────────────────
  # Contacts (Event-level)
  # ──────────────────────────────────────────────
  /v1/event/{eventId}/contacts:
    post:
      operationId: search-event-contacts
      summary: Search event contacts
      description: Search and filter contacts within an event.
      tags:
        - Contacts
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: The event ID.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSearchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
        '404':
          description: Event not found

  /v1/event/{eventId}/contacts/{contactId}:
    get:
      operationId: get-event-contact
      summary: Get an event contact
      description: Retrieve a single contact by ID at the event level.
      tags:
        - Contacts
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: The event ID.
        - name: contactId
          in: path
          required: true
          schema:
            type: string
          description: The contact ID.
        - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorized
        '404':
          description: Contact not found
    put:
      operationId: update-contact
      summary: Update a contact
      description: Update an existing contact. Requires the `write:contacts` scope. Optionally send `updated_at` for optimistic concurrency control.
      tags:
        - Contact Writes
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: The event ID.
        - name: contactId
          in: path
          required: true
          schema:
            type: string
          description: The contact ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updated_at:
                  type: string
                  format: date-time
                  description: Optional optimistic concurrency control. Send the `updated_at` value from the last-fetched contact.
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                company:
                  type: string
                title:
                  type: string
                phone:
                  type: string
                custom_fields:
                  type: object
                  additionalProperties: true
                  description: Custom field values keyed by field internal name.
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorized
        '403':
          description: Missing write:contacts scope
        '404':
          description: Contact not found
        '409':
          description: Stale update — contact modified since last fetch
    delete:
      operationId: delete-contact
      summary: Soft-delete a contact
      description: Soft-delete a contact. Can be restored with the restore endpoint. Requires the `write:contacts` scope.
      tags:
        - Contact Writes
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: The event ID.
        - name: contactId
          in: path
          required: true
          schema:
            type: string
          description: The contact ID.
      responses:
        '200':
          description: Contact deleted
        '401':
          description: Unauthorized
        '403':
          description: Missing write:contacts scope
        '404':
          description: Contact not found

