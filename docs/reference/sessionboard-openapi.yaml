        '200':
          description: Sponsor restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sponsor'
        '401':
          description: Unauthorized
        '403':
          description: Missing write:sponsors scope
        '404':
          description: Sponsor not found or not deleted

  /v1/event/{eventId}/sponsors/bulk:
    post:
      operationId: bulk-sponsors
      summary: Bulk sponsor operations
      description: Create, update, or delete multiple sponsors in a single request (max 100 operations). Requires the `write:sponsors` scope.
      tags:
        - Sponsor Writes
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: The event ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOperations'
      responses:
        '200':
          description: Bulk operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse'
        '401':
          description: Unauthorized
        '403':
          description: Missing write:sponsors scope
        '429':
          description: Rate limit or daily quota exceeded

  # ──────────────────────────────────────────────
  # Field Write Operations
  # ──────────────────────────────────────────────
  /v1/event/{eventId}/fields/create:
    post:
      operationId: create-field
      summary: Create a custom field
      description: Create a new custom field for an event module. Requires the `write:fields` scope.
      tags: [Field Writes]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string }
                module_id: { type: string }
      responses:
        '200': { description: Field created }
        '401': { description: Unauthorized }
        '403': { description: Missing write:fields scope }

  /v1/event/{eventId}/fields/{fieldId}:
    put:
      operationId: update-field
      summary: Update a custom field
      tags: [Field Writes]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
        - name: fieldId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Field updated }
        '401': { description: Unauthorized }
    delete:
      operationId: delete-field
      summary: Delete a custom field
      tags: [Field Writes]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
        - name: fieldId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Field deleted }
        '401': { description: Unauthorized }

  # ──────────────────────────────────────────────
  # OAuth 2.1
  # ──────────────────────────────────────────────
  /oauth/authorize:
    get:
      operationId: oauth-authorize
      summary: Validate authorization request
      description: Validates OAuth authorization request parameters (client_id, redirect_uri, scopes, PKCE challenge). Returns the validated request for display on the consent page. No authentication required.
      tags:
        - OAuth
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: scope
          in: query
          schema:
            type: string
          description: Space-separated scopes
        - name: state
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Authorization request validated
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_request:
                    type: object
                    properties:
                      client_id:
                        type: string
                      client_name:
                        type: string
                      redirect_uri:
                        type: string
                      scopes:
                        type: array
                        items:
                          type: string
        '400':
          description: Invalid request parameters

  /oauth/token:
    post:
      operationId: oauth-token
      summary: Exchange code for tokens
      description: Exchange an authorization code for access and refresh tokens (authorization_code grant), or refresh an expired access token (refresh_token grant). Uses PKCE verification — no client secret required.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Authorization Code Exchange
                  required: [grant_type, code, redirect_uri, client_id, code_verifier]
                  properties:
                    grant_type:
                      type: string
                      enum: [authorization_code]
                    code:
                      type: string
                    redirect_uri:
                      type: string
                    client_id:
                      type: string
                    code_verifier:
                      type: string
                      description: PKCE code verifier
                - type: object
                  title: Refresh Token
                  required: [grant_type, refresh_token, client_id]
                  properties:
                    grant_type:
                      type: string
                      enum: [refresh_token]
                    refresh_token:
                      type: string
                    client_id:
                      type: string
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
                  refresh_token:
                    type: string
                  scope:
                    type: string
        '400':
          description: Invalid grant or parameters

  /oauth/revoke:
    post:
      operationId: oauth-revoke
      summary: Revoke a token
      description: Revoke an access or refresh token. Conforms to RFC 7009. Always returns 200 regardless of whether the token was found.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
      responses:
        '200':
          description: Token revoked (or was already invalid)

  /oauth/.well-known/oauth-authorization-server:
    get:
      operationId: oauth-metadata
      summary: Authorization server metadata
      description: Returns OAuth 2.0 Authorization Server Metadata per RFC 8414. Includes supported scopes, grant types, and endpoint URLs.
      tags:
        - OAuth
      security: []
      responses:
        '200':
          description: Server metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  revocation_endpoint:
                    type: string
                  response_types_supported:
                    type: array
                    items:
                      type: string
                  grant_types_supported:
                    type: array
                    items:
                      type: string
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  code_challenge_methods_supported:
                    type: array
                    items:
                      type: string

  # ──────────────────────────────────────────────
  # Contact Sessions
  # ──────────────────────────────────────────────
  /v1/event/{eventId}/contacts/{contactId}/sessions:
    get:
      operationId: get-contact-sessions
      summary: Get a contact's sessions
      description: |
        Returns all sessions associated with a specific contact within an
        event, including linked composition sources. Each session summary
        includes `is_abstract` and `composition_status`. The full
        `composition` graph is not available on this lightweight endpoint —
        use session GET or search with `expand=composition` for details.
      tags:
        - Contacts
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSessionsResponse'
        '401':
          description: Unauthorized
        '404':
          description: Contact not found

  /v1/organization/{orgId}/contacts/{contactId}/sessions:
    get:
      operationId: get-org-contact-sessions
      summary: Get an org contact's sessions
      description: |
        Returns all sessions associated with a specific contact across the
        organization, including linked composition sources. Each session
        summary includes `is_abstract`, `composition_status`, and
        `event_id`. The full `composition` graph is not available on this
        lightweight endpoint.
      tags:
        - Contacts
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgContactSessionsResponse'
        '401':
          description: Unauthorized
        '404':
          description: Contact not found

  /v1/event/{eventId}/content:
    get:
      operationId: list-event-content
      summary: List composed session content for an event
      description: |
        Paginated list of session content packs (composed transcript, preferred summary,
        insights, podcast status, and document links). Prefer this over the raw
        polymorphic transcriptions list for mobile and partner apps.

        Requires `read:transcriptions` scope (legacy tokens with empty scopes pass).

        Default packs are compact (`elements` empty on transcription items). Pass
        `expand=items` (plus other types) for full element arrays.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: session_id
          in: query
          schema:
            type: string
            format: uuid
        - name: expand
          in: query
          description: |
            Comma-separated item types. Default `transcription,summary,insight,podcast,document`.
            Add `items` on the event list for full transcription elements (list is compact by default).
            `expand=items` alone still includes the default types. Session GET always returns full elements.
          schema:
            type: string
            example: transcription,summary,items
        - name: interval_sec
          in: query
          description: Optional time window (seconds) for rechunking same-speaker transcript elements. Omit for speaker turns only. Clamped to 3600.
          schema:
            type: integer
            minimum: 1
            maximum: 3600
        - name: provider
          in: query
          description: Preferred summary provider when multiple exist.
          schema:
            type: string
            enum: [claude, openai]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContentListResponse'
        '403':
          description: Missing read:transcriptions scope

  /v1/event/{eventId}/content/event:
    get:
      operationId: get-event-content
      summary: Get event-level content artifacts
      description: |
        Event report document metadata and recap rollup (quotes, topics, summary excerpts).
        Requires `read:transcriptions` scope. Default expand is `document,recap`.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: expand
          in: query
          description: Comma-separated. Default `document,recap`. Pass only the types you want.
          schema:
            type: string
            example: document,recap
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventContentResponse'
        '403':
          description: Missing read:transcriptions scope

  /v1/event/{eventId}/content/items/{itemId}:
    get:
      operationId: get-content-item
      summary: Get a single content item
      description: |
        Resolve one content item. `itemId` may be a session UUID (composed transcription),
        a summary/insight/podcast UUID, or a document type (`summary_pdf`, `summary_card`,
        `event_report`, `recap`). Document types `summary_pdf` / `summary_card` require
        `session_id`. Requires `read:transcriptions` scope.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
            format: uuid
        - name: interval_sec
          in: query
          schema:
            type: integer
            minimum: 1
        - name: provider
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemResponse'
        '400':
          description: Validation error
        '403':
          description: Missing read:transcriptions scope
        '404':
          description: Not found

  /v1/event/{eventId}/content/documents/{documentType}:
    get:
      operationId: download-event-content-document
      summary: Download an event content document
      description: Streams `event_report` PDF. Requires `read:transcriptions` scope.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: documentType
          in: path
          required: true
          schema:
            type: string
            enum: [event_report]
        - name: variant
          in: query
          schema:
            type: string
            enum: [full, daily, theme]
            default: full
      responses:
        '200':
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: Missing read:transcriptions scope
        '404':
          description: Not available

  /v1/event/{eventId}/sessions/{sessionId}/content:
    get:
      operationId: get-session-content
      summary: Get composed content for a session
      description: |
        Canonical one-call session pack for mobile and partner apps — composed
        transcription elements, preferred summary, insights, podcast URL/status,
        and summary PDF/card links. Distinct from session **composition**
        (abstract/parent-child linking).

        Requires `read:transcriptions` scope (legacy tokens with empty scopes pass).
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: expand
          in: query
          description: Comma-separated item types. Default `transcription,summary,insight,podcast,document`.
          schema:
            type: string
        - name: interval_sec
          in: query
          description: Optional time window (seconds) for rechunking same-speaker elements.
          schema:
            type: integer
            minimum: 1
        - name: provider
          in: query
          schema:
            type: string
            enum: [claude, openai]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContentResponse'
        '403':
          description: Missing read:transcriptions scope
        '404':
          description: Session not found

  /v1/event/{eventId}/sessions/{sessionId}/content/documents/{documentType}:
    get:
      operationId: download-session-content-document
      summary: Download a session content document
      description: Streams `summary_pdf` or `summary_card`. Requires `read:transcriptions` scope.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: documentType
          in: path
          required: true
          schema:
            type: string
            enum: [summary_pdf, summary_card]
      responses:
        '200':
          description: Document bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '403':
          description: Missing read:transcriptions scope
        '404':
          description: Not available

  /v1/event/{eventId}/transcriptions:
    get:
      operationId: list-event-transcriptions
      summary: List transcriptions for an event
      description: Paginated list of transcription artifacts across all sessions. Filter by type, session_id, or language_code. Requires `read:transcriptions` scope (legacy tokens with empty scopes pass). Prefer `/content` for composed mobile-friendly packs.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            type: string
            enum: [fragment, summary, insight, translation]
        - name: session_id
          in: query
          schema:
            type: string
            format: uuid
        - name: language_code
          in: query
          schema:
            type: string
        - name: include_partial
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionListResponse'
        '403':
          description: Missing read:transcriptions scope

  /v1/event/{eventId}/transcriptions/{transcriptionId}:
    get:
      operationId: get-transcription
      summary: Get a transcription by ID
      description: Requires `read:transcriptions` scope (legacy tokens with empty scopes pass).
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: transcriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '403':
          description: Missing read:transcriptions scope
        '404':
          description: Not found

  /v1/event/{eventId}/sessions/{sessionId}/transcriptions:
    get:
      operationId: list-session-transcriptions
      summary: List transcriptions for a session
      description: Requires `read:transcriptions` scope (legacy tokens with empty scopes pass).
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionListResponse'
        '403':
          description: Missing read:transcriptions scope
    post:
      operationId: create-transcription
      summary: Create a transcription artifact
      description: Requires `write:transcriptions` scope.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '403':
          description: Missing write:transcriptions scope

  /v1/event/{eventId}/sessions/{sessionId}/transcriptions/{transcriptionId}:
    get:
      operationId: get-session-transcription
      summary: Get a session transcription by ID
      description: Requires `read:transcriptions` scope (legacy tokens with empty scopes pass).
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: transcriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '403':
          description: Missing read:transcriptions scope
        '404':
          description: Not found
    put:
      operationId: update-transcription
      summary: Update a transcription artifact
      description: Requires `write:transcriptions` scope.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: transcriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '403':
          description: Missing write:transcriptions scope
    delete:
      operationId: delete-transcription
      summary: Delete a transcription artifact
      description: Requires `write:transcriptions` scope.
      tags: [Transcriptions]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: transcriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          description: Missing write:transcriptions scope

  /v1/event/{eventId}/sessions/{sessionId}/recordings:
    get:
      operationId: list-session-recordings
      summary: List session audio recordings
      description: Requires `read:transcriptions` scope (legacy tokens with empty scopes pass).
      tags: [Session Recordings]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recording'
        '403':
          description: Missing read:transcriptions scope
    post:
      operationId: create-session-recording
      summary: Initiate session audio upload
      description: Returns a presigned upload URL for the audio file. Requires `write:transcriptions`.
      tags: [Session Recordings]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size_bytes]
              properties:
                filename:
                  type: string
                content_type:
                  type: string
                size_bytes:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCreateResponse'
        '403':
          description: Missing write:transcriptions scope

  /v1/event/{eventId}/sessions/{sessionId}/recordings/{recordingId}:
    get:
      operationId: get-session-recording
      summary: Get a session audio recording
      description: Requires `read:transcriptions` scope (legacy tokens with empty scopes pass).
      tags: [Session Recordings]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResponse'
        '403':
          description: Missing read:transcriptions scope
        '404':
          description: Not found

  /v1/event/{eventId}/sessions/{sessionId}/recordings/{recordingId}/complete:
    post:
      operationId: complete-session-recording
      summary: Finalize session audio upload
      description: |
        Marks the recording as completed and normalizes common audio formats for playback.
        Already-completed recordings return 200 without re-processing. Requires `write:transcriptions`.
      tags: [Session Recordings]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_seconds:
                  type: number
                file_size_bytes:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResponse'
        '403':
          description: Missing write:transcriptions scope
        '422':
          description: PCM transcode failed (TRANSCODE_ERROR)

  /v1/event/{eventId}/sessions/{sessionId}/media/upload/initiate:
    post:
      operationId: initiate-media-upload
      summary: Start multipart media upload
      description: Begins a multipart upload for a video or audio file on a session. Requires `write:media`.
      tags: [Media]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size_bytes]
              properties:
                filename:
                  type: string
                content_type:
                  type: string
                size_bytes:
                  type: integer
      responses:
        '201':
          description: Created
        '403':
          description: Missing write:media scope

  /v1/event/{eventId}/sessions/{sessionId}/media/upload/sign-part:
    post:
      operationId: sign-media-upload-part
      summary: Sign multipart upload parts
      description: Requires `write:media`.
      tags: [Media]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, upload_id, part_numbers]
              properties:
                key:
                  type: string
                upload_id:
                  type: string
                part_numbers:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: OK
        '403':
          description: Missing write:media scope

  /v1/event/{eventId}/sessions/{sessionId}/media/upload/abort:
    post:
      operationId: abort-media-upload
      summary: Abort multipart upload
      description: Requires `write:media`.
      tags: [Media]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, upload_id]
              properties:
                key:
                  type: string
                upload_id:
                  type: string
      responses:
        '200':
          description: OK
        '403':
          description: Missing write:media scope

  /v1/event/{eventId}/sessions/{sessionId}/media/upload/complete:
    post:
      operationId: complete-media-upload
      summary: Complete multipart media upload
      description: |
        Finalizes the upload and starts automatic transcription. When you upload on a session URL,
        transcript lines appear in the session transcription list when processing finishes.
        Requires `write:media`.
      tags: [Media]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, upload_id, parts, filename, size_bytes]
              properties:
                key:
                  type: string
                upload_id:
                  type: string
                parts:
                  type: array
                  items:
                    type: object
                    required: [part_number, etag]
                    properties:
                      part_number:
                        type: integer
                      etag:
                        type: string
                filename:
                  type: string
                size_bytes:
                  type: integer
                duration_seconds:
                  type: number
      responses:
        '201':
          description: Created
        '403':
          description: Missing write:media scope

  /v1/event/{eventId}/sessions/{sessionId}/media/{mediaItemId}:
    get:
      operationId: get-media-item
      summary: Get media item status
      description: Check upload and transcription progress after completing an upload. Requires `read:media` (legacy tokens with empty scopes pass).
      tags: [Media]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemResponse'
        '403':
          description: Missing read:media scope
        '404':
          description: Not found

  /v1/event/{eventId}/sessions/{sessionId}/files:
    get:
      operationId: list-session-files
      summary: List files attached to a session
      description: |
        Returns completed files on the session (latest version per file group).
        Incomplete uploads (create/replace without complete) are omitted.
        Requires `read:sessions` scope (legacy tokens with empty scopes pass).
      tags: [Session Files]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFileListResponse'
        '403':
          description: Missing read:sessions scope
        '404':
          description: Session not found
    post:
      operationId: create-session-file
      summary: Initiate session file upload
      description: |
        Creates a file record and returns a short-lived S3 upload URL.
        Requires `write:sessions`.

        Next: `PUT` the file bytes to `data.upload.url`, then call
        `POST .../files/{fileId}/complete`. For files up to **50 MB**, prefer
        `POST .../files/upload` (one multipart call). This direct-to-storage
        path supports up to **500 MB**.
        See [Uploading session files](/guides/uploading-session-files).
      tags: [Session Files]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFileCreateRequest'
            examples:
              powerpoint:
                summary: PowerPoint slides
                value:
                  filename: keynote-slides.pptx
                  size_bytes: 2457600
                  content_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
                  title: Keynote slides
              pdf:
                summary: PDF handout
                value:
                  filename: handout.pdf
                  size_bytes: 512000
                  content_type: application/pdf
                  title: Session handout
      responses:
        '201':
          description: Created — upload URL included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFileCreateResponse'
        '400':
          description: Validation error (missing fields, oversize, denied type)
        '403':
          description: Missing write:sessions scope

  /v1/event/{eventId}/sessions/{sessionId}/files/upload:
    post:
      operationId: upload-session-file
      summary: Upload a session file (simple)
      description: |
        Upload a file in one multipart request. Sessionboard detects size and
        MIME type from the bytes, runs security scanning, and returns the
        finalized file. Max **50 MB**. Requires `write:sessions`.

        For files larger than 50 MB (up to 500 MB), use the direct-to-storage
        flow: `POST .../files` → PUT to signed URL → `POST .../complete`.
        See [Uploading session files](/guides/uploading-session-files).
      tags: [Session Files]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to attach (field name must be `file`).
                title:
                  type: string
                  description: Display title. Defaults to the uploaded filename.
                assigned_participant_id:
                  type: string
                  format: uuid
                  description: Contact UUID of a session participant.
      responses:
        '201':
          description: Created — file attached and scanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFileResponse'
        '400':
          description: Validation error (missing file, oversize, denied type)
        '403':
          description: Missing write:sessions scope

  /v1/event/{eventId}/sessions/{sessionId}/files/{fileId}/complete:
    post:
      operationId: complete-session-file
      summary: Finalize session file upload
      description: |
        Verifies the object in Sessionboard storage, runs security scanning
        (type deny-list + magic-byte checks; SVG sanitization when applicable),
        and finalizes the file on the session. Requires `write:sessions`.
      tags: [Session Files]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFileResponse'
        '400':
          description: Upload missing, empty, or failed security checks
        '403':
          description: Missing write:sessions scope
        '404':
          description: File not found

  /v1/event/{eventId}/sessions/{sessionId}/files/{fileId}/replace:
    post:
      operationId: replace-session-file
      summary: Replace session file bytes
      description: |
        Issues a new upload URL for the same file record. After `PUT`ing the new
        bytes, call `complete` again. Requires `write:sessions`. Max **500 MB**
        (direct-to-storage flow).
      tags: [Session Files]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFileCreateRequest'
      responses:
        '200':
          description: OK — new upload URL included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFileCreateResponse'
        '400':
          description: Validation error
        '403':
          description: Missing write:sessions scope
        '404':
          description: File not found

  /v1/event/{eventId}/sessions/{sessionId}/files/{fileId}:
    put:
      operationId: update-session-file
      summary: Update session file metadata
      description: |
        Updates display title and/or assigned participant. Does not change file
        bytes — use `replace` for that. Unknown fields are ignored.
        Requires `write:sessions`.
      tags: [Session Files]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFileResponse'
        '400':
          description: Validation error
        '403':
          description: Missing write:sessions scope
        '404':
          description: File not found
    delete:
      operationId: delete-session-file
      summary: Delete a session file
      description: Soft-deletes the file from the session. Requires `write:sessions`.
      tags: [Session Files]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: No Content
        '403':
          description: Missing write:sessions scope
        '404':
          description: File not found

# ════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-access-token
      description: Organization API token. Generate from Organization Settings → API Tokens.
    BearerToken:
      type: http
      scheme: bearer
      description: OAuth 2.1 access token. Obtained via the OAuth PKCE flow at `/oauth/token`.

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
      description: Event ID
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session UUID
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session file (Content) UUID
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 1
      description: Page number for pagination.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of results per page.
    Expand:
      name: expand
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - translated_fields
            - subsession_details
            - linked_sources
            - composition
      description: |
        Expand records with additional data.

        Possible values:
        - `translated_fields` — includes the `translated_fields` array on records when the event has language variants configured.
        - `subsession_details` — applies to session responses. Each subsession inside `parent.subsessions[]` is returned with full parent-session field parity (`status`, `custom_status`, `custom_fields`, `chairpersons`, `moderators`, `sponsors`, `exhibitors`, `tags`, `language`, `track`, `level`, `room`, `is_public`, `external_url`, `client_session_id`, `ceu_credits`, `capacity`, `source`) instead of the default minimal shape. Subsessions inherit `is_abstract`, `composition_status`, and optional `composition` from the parent. Not required when calling `GET /v1/event/{eventId}/sessions/{sessionId}` with a subsession UUID — that endpoint always returns the full shape at the top level.
        - `linked_sources` — include sessions that are linked as composition sources (excluded from list/search results by default).
        - `composition` — attach a full `composition` object with target and source details on each returned session. Recommended for single-session GET; use cautiously on broad searches.

  schemas:
    # ────────────────────────────────────────────
    # Shared filter / sort helpers
    # ────────────────────────────────────────────
    DateRangeFilter:
      type: object
      description: Filter by a date range using before and/or after bounds.
      properties:
        before:
          type: string
          format: date-time
          description: Return records before this date-time.
        after:
          type: string
          format: date-time
          description: Return records after this date-time.

    SortOptions:
      type: object
      description: Sorting options for search results.
      properties:
        order:
          type: string
          enum:
            - createdAt
            - updatedAt
          description: The field to sort by.
        sort:
          type: string
          enum:
            - asc
            - desc
          description: Sort direction.

    RecordSearchBody:
      type: object
      description: Common search request body used across multiple endpoints.
      properties:
        filters:
          type: object
          properties:
            createdAt:
              $ref: '#/components/schemas/DateRangeFilter'
            updatedAt:
              $ref: '#/components/schemas/DateRangeFilter'
            status:
              type: string
              enum:
                - accepted
                - accept_queue
                - pending
                - decline_queue
                - declined
              description: Filter by session status (applicable to session searches).
        sort:
          $ref: '#/components/schemas/SortOptions'
        expand:
          type: array
          items:
            type: string
            enum:
              - translated_fields
              - subsession_details
              - linked_sources
              - composition
          description: |
            Expand records with additional data. See the `Expand` parameter for `linked_sources` and `composition` details.

    SessionSearchBody:
      type: object
      description: Search request body for sessions with status filtering.
      properties:
        filters:
          type: object
          properties:
            createdAt:
              $ref: '#/components/schemas/DateRangeFilter'
            updatedAt:
              $ref: '#/components/schemas/DateRangeFilter'
            status:
              type: string
              enum:
                - accepted
                - accept_queue
                - pending
                - decline_queue
                - declined
            isAbstract:
              type: boolean
              description: Filter to abstract submissions (`true`) or program sessions (`false`).
        sort:
          $ref: '#/components/schemas/SortOptions'
        expand:
          type: array
          items:
            type: string
            enum:
              - translated_fields
              - subsession_details
              - linked_sources
              - composition

    Pagination:
      type: object
      description: Pagination metadata returned with list responses.
      properties:
        currentPage:
          type: integer
          examples:
            - 1
        pageSize:
          type: integer
          examples:
            - 25
        totalPages:
          type: integer
          examples:
            - 4
        totalResults:
          type: integer
          examples:
            - 97

    # ────────────────────────────────────────────
    # Core domain objects
    # ────────────────────────────────────────────
    CompositionTargetSummary:
      type: object
      description: Summary of a related session in a composition relationship.
      properties:
        id:
          type: string
          format: uuid
        friendly_id:
          type: string
        title:
          type: string
        is_abstract:
          type: boolean

    CompositionStatus:
      type: object
      description: |
        Summary of how this session participates in a composition (merge or link).
        Always present on session responses.
      properties:
        role:
          type: string
          enum:
            - standalone
            - target
            - source
          description: |
            - `standalone` — normal editable record
            - `target` — composite parent with one or more linked sources
            - `source` — linked into another record (read-only)
        is_linked:
          type: boolean
        is_read_only:
          type: boolean
        source_count:
          type: integer
          description: Number of records merged or linked into this session.
        target:
          allOf:
            - $ref: '#/components/schemas/CompositionTargetSummary'
          nullable: true
          description: Present when `role` is `source`.

    CompositionSource:
      type: object
      properties:
        composition_id:
          type: string
          format: uuid
        relationship_type:
          type: string
          enum:
            - merged_session
            - merged_abstract
            - composed_into_session
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        friendly_id:
          type: string
        title:
          type: string
        is_abstract:
          type: boolean

    CompositionDetail:
      type: object
      description: Full composition graph. Present when `expand=composition`.
      properties:
        target:
          allOf:
            - $ref: '#/components/schemas/CompositionTargetSummary'
          nullable: true
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CompositionSource'

    ContactSessionSummary:
      type: object
      description: |
        Lightweight session summary for contact session lists. Includes
        composition summary fields but not the full `composition` graph.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        custom_status:
          type: string
          nullable: true
        is_abstract:
          type: boolean
        composition_status:
          $ref: '#/components/schemas/CompositionStatus'

    OrgContactSessionSummary:
      allOf:
        - $ref: '#/components/schemas/ContactSessionSummary'
        - type: object
          properties:
            event_id:
              type: integer
              description: Event the session belongs to.

    ContactSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ContactSessionSummary'
        status:
          type: string
          description: |
            Aggregated contact status derived from linked sessions
            (`accepted`, `pending`, or a single session's status).

    OrgContactSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/OrgContactSessionSummary'
        status:
          type: string
          description: |
            Aggregated contact status derived from linked sessions
            (`accepted`, `pending`, or a single session's status).

    Event:
      type: object
      description: An event on the Sessionboard platform.
      properties:
        id:
          type: integer
          examples:
            - 3960
        name:
          type: string
          examples:
            - "Acme Conference"
        timezone:
          type: string
          examples:
            - "America/Chicago"
        features:
          type: object
          properties:
            translated_fields:
              type: boolean

    Session:
      type: object
      description: A session within an event (e.g., talk, workshop, panel, or CFP abstract submission).
      properties:
        id:
          type: string
          format: uuid
        friendly_id:
          type: string
        friendly_id_raw:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - accepted
            - accept_queue
            - pending
            - decline_queue
            - declined
        custom_status_id:
          type: string
        custom_status:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_public:
          type: boolean
        is_abstract:
          type: boolean
          description: True for CFP abstract submissions; false for program sessions.
        composition_status:
          $ref: '#/components/schemas/CompositionStatus'
        composition:
          $ref: '#/components/schemas/CompositionDetail'
          description: Present when `expand=composition` is requested.
        external_url:
          type: string
          format: uri
        client_session_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ceu_credits:
          type: number
          format: float
        capacity:
          type: integer
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldValue'
        translated_fields:
          type: array
          items:
            $ref: '#/components/schemas/TranslatedField'
        speakers:
          type: array
          description: |
            Legacy junction-table speakers (`Session_Speakers`). Retained for backwards
            compatibility. Each entry includes `participant_role` when the event has
            Sessions 2.0 roles configured. Prefer `participants` for new integrations
            that need custom program roles or a single flat participant list.
          items:
            $ref: '#/components/schemas/SessionSpeaker'
        chairpersons:
          type: array
          description: |
            Legacy junction-table chairpersons (`Session_Chairpersons`). See `speakers`
            for migration guidance.
          items:
            $ref: '#/components/schemas/SessionSpeaker'
        moderators:
          type: array
          description: |
            Legacy junction-table moderators (`Session_Moderators`). See `speakers`
            for migration guidance.
          items:
            $ref: '#/components/schemas/SessionSpeaker'
        participants:
          type: array
          description: |
            Flat list of session participants from the Sessions 2.0 data model
            (`Session_Participants` + `Session_Roles`). Always returned on session
            search and get (no expand flag). Includes custom program roles (for example
            Author, Panelist) in addition to the legacy speaker/chairperson/moderator
            junction tables. Legacy arrays above remain for backwards compatibility;
            each legacy entry also includes `participant_role` when event roles are
            configured. Contact profile fields (`photo_url`, `company_name`, `title`,
            `address_country`, etc.) are hydrated from the contact record in the event's
            default language without requiring expand.
          items:
            $ref: '#/components/schemas/SessionParticipant'
        sponsors:
          type: array
          items:
            $ref: '#/components/schemas/SessionSponsor'
        exhibitors:
          type: array
          items:
            $ref: '#/components/schemas/SessionExhibitor'
        content:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: |
            Assigned session language. Includes `id`, `event_id`, `name`, `order`,
            `created_at`, and `updated_at` when set. Unassigned values are an
            empty object `{}` on `POST` session search responses and `null` on
            CRUD proxy responses (`GET` list, create, update, restore).
        track:
          allOf:
            - $ref: '#/components/schemas/Track'
          description: |
            Assigned session track. Includes `id`, `event_id`, `name`, `color`,
            `order`, `created_at`, and `updated_at` when set. Unassigned values
            are `{}` on `POST` session search and `null` on CRUD proxy responses.
        level:
          allOf:
            - $ref: '#/components/schemas/Level'
          description: |
            Assigned session level. Includes `id`, `name`, `order`, `created_at`,
            and `updated_at` when set (no `event_id` on nested objects). Unassigned
            values are `{}` on `POST` session search and `null` on CRUD proxy responses.
        format:
          type: object
          description: |
            Assigned session format. Nested session objects include only `id` and
            `name` (not the full standalone `Format` schema).
          properties:
            id:
              type: string
            name:
              type: string
        room:
          allOf:
            - $ref: '#/components/schemas/Room'
          description: |
            Assigned room when `location` is `room`. Includes `id`, `name`,
            `order`, `capacity`, `created_at`, and `updated_at` when set. Omitted
            when location is `external` or unset (`{}` on `POST` search, `null` on
            CRUD proxy). `event_id` is not included on nested room objects.
        subsessions:
          type: array
          description: |
            Subsessions of this parent session. Each item defaults to the
            minimal `Subsession` shape; pass `expand=subsession_details` to
            receive the full `SubsessionDetailed` shape on every subsession
            in the array. Composition fields (`is_abstract`,
            `composition_status`, optional `composition`) are inherited from
            the parent session.
          items:
            oneOf:
              - $ref: '#/components/schemas/Subsession'
              - $ref: '#/components/schemas/SubsessionDetailed'
        admin_url:
          type: string
          format: uri
          nullable: true
          description: Deep link to this entity in the Sessionboard admin UI.
      examples:
        - id: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
          friendly_id: "SESS-8"
          friendly_id_raw: 8
          title: "Networking"
          description: "<p>Networking session description</p>"
          status: "accepted"
          starts_at: "2024-03-15T09:00:00Z"
          ends_at: "2024-03-15T10:00:00Z"
          is_public: true
          created_at: "2024-01-10T14:30:00Z"
          updated_at: "2024-03-01T09:15:00Z"
          ceu_credits: 1.5
          capacity: 200
          language:
