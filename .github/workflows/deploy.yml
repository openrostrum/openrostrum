name: Deploy

# Production auto-deploy on merge to main. GATED: skips cleanly until the
# Cloudflare credentials + resources exist (real D1 database_id in wrangler.json,
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets) — provisioned in the
# verification-capabilities phase.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - id: creds
        run: echo "have=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Skip notice
        if: steps.creds.outputs.have != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy (provision Cloudflare first)."
      - uses: actions/checkout@v4
        if: steps.creds.outputs.have == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.have == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.have == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.have == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.have == 'true'
        run: pnpm build
      - name: Apply D1 migrations (remote)
        if: steps.creds.outputs.have == 'true'
        run: pnpm exec wrangler d1 migrations apply killmysaas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.have == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
