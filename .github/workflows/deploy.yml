name: Deploy

# Production auto-deploy on merge to main. GATED: skips cleanly until the
# Cloudflare credentials exist (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID +
# CLOUDFLARE_D1_DATABASE_ID repo secrets) — provisioned in the
# verification-capabilities phase. The real D1 id is injected into wrangler.json
# at deploy time from CLOUDFLARE_D1_DATABASE_ID, so the committed placeholder
# never needs a manual edit.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - id: creds
        run: echo "have=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Skip notice
        if: steps.creds.outputs.have != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy (provision Cloudflare first)."
      - uses: actions/checkout@v4
        if: steps.creds.outputs.have == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.have == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.have == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.have == 'true'
        run: pnpm install --frozen-lockfile
      # MUST run BEFORE build: the CF Vite plugin bakes wrangler.json into
      # build/server/wrangler.json, and `wrangler deploy` reads THAT redirected
      # config — patching the root file after build would be ignored.
      - name: Inject D1 database id
        if: steps.creds.outputs.have == 'true'
        run: |
          tmp="$(mktemp)"
          jq --arg id "$CLOUDFLARE_D1_DATABASE_ID" \
            '.d1_databases[0].database_id = $id' wrangler.json > "$tmp"
          mv "$tmp" wrangler.json
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      - if: steps.creds.outputs.have == 'true'
        run: pnpm build
      - name: Apply D1 migrations (remote)
        if: steps.creds.outputs.have == 'true'
        run: pnpm exec wrangler d1 migrations apply killmysaas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.have == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
