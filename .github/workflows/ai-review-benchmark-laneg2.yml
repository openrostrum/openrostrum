name: AI review fallback benchmark lane G2

on:
  push:
    branches: [feat/ai-review-deepseek]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Workers AI benchmark
        run: |
          pnpm exec wrangler dev \
            --config tooling/ai-review-benchmark/wrangler.json \
            --port 8798 > /tmp/benchmark-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -sS -o /dev/null http://127.0.0.1:8798; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/benchmark-worker.log
              exit 1
            fi
            sleep 1
          done
          node tooling/ai-review-benchmark/run.mjs \
            > ai-review-benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-review-benchmark-laneG2
          path: ai-review-benchmark-results.json
          if-no-files-found: error
          retention-days: 7
