name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR MUST target main. No stacked PRs onto integration/* or any other
  # branch: a PR based on unmerged work auto-closes if its base merges first
  # (and its commits silently ride along in whatever else descends from it).
  # Keeps history flat and every PR independently reviewable+mergeable.
  require-base-main:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PRs must target main
        if: github.base_ref != 'main'
        run: |
          echo "::error::This PR targets '${{ github.base_ref }}', not 'main'. Change the PR base to main."
          exit 1

  # Server-side twin of scripts/guard-schema.sh: pre-commit hooks are bypassable
  # (--no-verify), this is not. Fails any PR from a feature branch that touches
  # an integration-owned shared file. The integration owner ships those changes
  # on branches prefixed `integration/` (or direct pushes to main).
  guard-shared-files:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'integration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block integration-owned file changes
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq \
            '^(app/db/schema\.ts|drizzle/seed\.sql|package\.json|pnpm-lock\.yaml|wrangler\.json|app/app\.css)$|^drizzle/migrations/|^app/ui/'; then
            echo "::error::This branch edits an integration-owned shared file (schema/migrations/seed/package.json/lockfile/wrangler.json)."
            echo "::error::Request the change from the integration owner, or ship it on an integration/* branch."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
