name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR MUST target main. No stacked PRs onto integration/* or any other
  # branch: a PR based on unmerged work auto-closes if its base merges first
  # (and its commits silently ride along in whatever else descends from it).
  # Keeps history flat and every PR independently reviewable+mergeable.
  require-base-main:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PRs must target main
        if: github.base_ref != 'main'
        run: |
          echo "::error::This PR targets '${{ github.base_ref }}', not 'main'. Change the PR base to main."
          exit 1

  # Server-side twin of scripts/guard-schema.sh: pre-commit hooks are bypassable
  # (--no-verify), this is not. Fails any PR from a feature branch that touches
  # an integration-owned shared file. The integration owner ships those changes
  # on branches prefixed `integration/` (or direct pushes to main).
  guard-shared-files:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'integration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block integration-owned file changes
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq \
            '^(app/db/schema\.ts|drizzle/seed\.sql|package\.json|pnpm-lock\.yaml|wrangler\.json|app/app\.css)$|^drizzle/migrations/|^app/ui/'; then
            echo "::error::This branch edits an integration-owned shared file (schema/migrations/seed/package.json/lockfile/wrangler.json)."
            echo "::error::Request the change from the integration owner, or ship it on an integration/* branch."
            exit 1
          fi

  # DeepSeek code review (advisory, comment-only — the review event is always
  # COMMENT). Posts findings as one review with inline comments; posting model
  # and reconcile semantics: tooling/pr-review/README.md. Security boundary:
  # `pull_request` trigger (NOT pull_request_target) — fork PRs never receive
  # the secret or write token (guard green-skips).
  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Required check that gates merge — cap the wall-clock so a stuck run can
    # never block PRs indefinitely (the per-request timeout is in core.mjs).
    timeout-minutes: 20
    # pull-requests: write covers all posting (review, comments, replies,
    # best-effort GraphQL thread resolution).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Guard — review only when configured
        id: guard
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::warning::AI review skipped — set the DEEPSEEK_API_KEY repo secret to enable it."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.guard.outputs.go == 'true'
      - name: Review the diff
        if: steps.guard.outputs.go == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/pr-review/ci-review.mjs

  quality-checks:
    name: quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Node-only tests for every tooling/ suite. Outside `pnpm test` (workerd
      # has no node:test) and in THIS unconditional job, not the secret-gated
      # ai-review — see tooling/pr-review/README.md.
      - name: Test tooling
        run: pnpm test:tooling
      - name: Build
        run: pnpm build

  test:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test shard ${{ matrix.shard }}/3
        run: pnpm test --shard=${{ matrix.shard }}/3

  # Keep one stable required check while the test suite runs in parallel.
  quality:
    if: always()
    needs: [quality-checks, test]
    runs-on: ubuntu-latest
    steps:
      - name: Gate quality checks and all test shards
        env:
          QUALITY_CHECKS_RESULT: ${{ needs.quality-checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$QUALITY_CHECKS_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "::error::quality checks: $QUALITY_CHECKS_RESULT; test matrix: $TEST_RESULT"
            exit 1
          fi

  # main is the live site: once quality is green, migrate remote D1 and deploy
  # to Cloudflare. Deployer-specific values are injected from repo secrets, so
  # the committed wrangler.json stays generic (open-source safe). Until the
  # secrets exist the guard step skips the rest — the job stays green, never a
  # red X on main. Most runtime secrets persist after `wrangler secret put`;
  # DEEPSEEK_API_KEY is synced below from the write-only GitHub repo secret.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
    steps:
      - name: Guard — deploy only when configured
        id: guard
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CF_D1_DATABASE_ID}" ]; then
            echo "::warning::Auto-deploy skipped — set the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and CF_D1_DATABASE_ID repo secrets to enable it."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.go == 'true'
      - name: Migrate remote D1
        if: steps.guard.outputs.go == 'true'
        run: |
          node scripts/inject-wrangler-id.mjs wrangler.json
          pnpm db:migrate:remote
      - name: Deploy to Cloudflare
        if: steps.guard.outputs.go == 'true'
        run: pnpm run deploy
      - name: Sync DeepSeek API key
        if: steps.guard.outputs.go == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::notice::DeepSeek secret sync skipped — DEEPSEEK_API_KEY repo secret is not configured."
            exit 0
          fi
          printf '%s' "$DEEPSEEK_API_KEY" | pnpm exec wrangler secret put DEEPSEEK_API_KEY

  # Same-repo PRs get a clickable preview after quality is green. Isolation is
  # a separate Worker + D1 + R2 named openrostrum-pr-<n> — never the production
  # worker, D1, R2, custom domain, crons, or Resend key. Fork PRs skip. This
  # job is advisory: do not add it to required status checks. A Cloudflare
  # outage or token-scope miss must not block merge.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Guard — preview only when Cloudflare is configured
        id: guard
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::PR preview skipped — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.go == 'true'
      - name: Build
        if: steps.guard.outputs.go == 'true'
        run: pnpm build
      - name: Deploy isolated preview
        if: steps.guard.outputs.go == 'true'
        run: pnpm preview:deploy
