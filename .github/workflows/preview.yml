name: Preview

# Per-PR preview deploy via `wrangler versions upload` (a preview URL without
# promoting to production), commented back on the PR. GATED like deploy.yml.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - id: creds
        run: echo "have=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Skip notice
        if: steps.creds.outputs.have != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping preview deploy."
      - uses: actions/checkout@v4
        if: steps.creds.outputs.have == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.have == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.have == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.have == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.have == 'true'
        run: pnpm build
      - id: upload
        if: steps.creds.outputs.have == 'true'
        run: |
          out="$(pnpm exec wrangler versions upload 2>&1 | tee /dev/stderr)"
          url="$(printf '%s' "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview URL
        if: steps.creds.outputs.have == 'true' && steps.upload.outputs.url != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 Preview deployed: ${{ steps.upload.outputs.url }}`,
            });
